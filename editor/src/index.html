<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Melviz Editor</title>
    <link rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23667eea'/%3E%3Cstop offset='1' stop-color='%23764ba2'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23g)'/%3E%3Cg fill='%23fff'%3E%3Crect x='8' y='16' width='4' height='8' rx='1.5'/%3E%3Crect x='14' y='10' width='4' height='14' rx='1.5'/%3E%3Crect x='20' y='6' width='4' height='18' rx='1.5'/%3E%3C/g%3E%3C/svg%3E">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header class="topbar">
        <a class="brand" href="#" aria-label="Melviz Editor">
            <span class="brand-mark" aria-hidden="true">
                <svg width="26" height="26" viewBox="0 0 32 32">
                    <defs>
                        <linearGradient id="brand-grad" x1="0" y1="0" x2="1" y2="1">
                            <stop offset="0" stop-color="#667eea" />
                            <stop offset="1" stop-color="#764ba2" />
                        </linearGradient>
                    </defs>
                    <rect width="32" height="32" rx="8" fill="url(#brand-grad)" />
                    <g fill="#fff">
                        <rect x="8" y="16" width="4" height="8" rx="1.5" />
                        <rect x="14" y="10" width="4" height="14" rx="1.5" />
                        <rect x="20" y="6" width="4" height="18" rx="1.5" />
                    </g>
                </svg>
            </span>
            <span class="brand-name">Melviz <span class="brand-sub">Editor</span></span>
        </a>

        <div class="topbar-actions">
            <button class="btn btn-ghost icon-btn" id="new-file" title="New file">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
                    <path d="M14 2v6h6" />
                    <path d="M12 18v-6" />
                    <path d="M9 15h6" />
                </svg>
                <span class="btn-label">New</span>
            </button>
            <button class="btn btn-ghost icon-btn" id="open-file" title="Open a dashboard YAML file from your disk">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="m22 19-7-7 7-7" />
                    <path d="M15 5H9a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7z" />
                </svg>
                <span class="btn-label">Open</span>
            </button>
            <button class="btn btn-ghost icon-btn" id="download-file" title="Download the current dashboard YAML">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                    <path d="m7 10 5 5 5-5" />
                    <path d="M12 15V3" />
                </svg>
                <span class="btn-label">Download</span>
            </button>
            <button class="btn btn-ghost icon-btn" id="github-btn" title="Open a file from GitHub">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                    <path
                        d="M12 2C6.48 2 2 6.58 2 12.25c0 4.53 2.87 8.37 6.84 9.73.5.1.68-.22.68-.49 0-.24-.01-.88-.01-1.73-2.78.62-3.37-1.37-3.37-1.37-.45-1.18-1.11-1.5-1.11-1.5-.91-.64.07-.62.07-.62 1 .07 1.53 1.06 1.53 1.06.9 1.57 2.35 1.12 2.92.85.09-.66.35-1.12.63-1.37-2.22-.26-4.56-1.14-4.56-5.07 0-1.12.39-2.03 1.03-2.75-.1-.26-.45-1.3.1-2.7 0 0 .84-.28 2.75 1.05a9.35 9.35 0 0 1 5 0c1.91-1.33 2.75-1.05 2.75-1.05.55 1.4.2 2.44.1 2.7.64.72 1.03 1.63 1.03 2.75 0 3.94-2.34 4.8-4.57 5.06.36.32.68.94.68 1.9 0 1.37-.01 2.48-.01 2.82 0 .27.18.6.69.49A10.28 10.28 0 0 0 22 12.25C22 6.58 17.52 2 12 2z" />
                </svg>
                <span class="btn-label">GitHub</span>
            </button>
            <span class="topbar-sep"></span>
            <button class="btn btn-ghost icon-btn" id="save-file" title="Save current file state to the browser storage">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z" />
                    <path d="M17 21v-8H7v8" />
                    <path d="M7 3v5h8" />
                </svg>
                <span class="btn-label" id="save-label">Save</span>
            </button>
            <button class="btn btn-ghost icon-btn" id="themeToggle" title="Switch theme" aria-label="Toggle color theme">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                    stroke-linecap="round">
                    <circle cx="12" cy="12" r="4" />
                    <path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.8 11.8 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
                </svg>
            </button>
        </div>
    </header>

    <div class="workspace" id="workspace">
        <!-- ================= Editor (left) ================= -->
        <aside class="editor-panel" id="editor-panel" aria-label="Dashboard YAML editor">
            <div class="panel-head">
                <span class="file-name" id="file-name" title="Current file name">dashboard.yaml</span>
                <span class="file-status" id="file-status" aria-live="polite"></span>
            </div>
            <div id="editor"></div>
        </aside>

        <div class="panel-resizer" id="panel-resizer" role="separator" aria-orientation="vertical"
            aria-label="Resize editor panel" tabindex="0" title="Drag to resize · double-click to reset"></div>

        <!-- ================= Preview (right) ================= -->
        <section class="preview-panel" id="preview-panel" aria-label="Melviz dashboard preview">
            <div class="panel-head preview-head">
                <span class="preview-title">Preview</span>
                <span class="refresh-state" id="refresh-state">
                    <span class="refresh-dot" id="refresh-dot" title="Live refresh: 500 ms"></span>
                </span>
                <span class="panel-head-actions">
                    <button class="btn btn-ghost icon-btn" id="reload-preview" title="Reload the preview now">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 12a9 9 0 1 1-2.64-6.36" />
                            <path d="M21 3v6h-6" />
                        </svg>
                    </button>
                </span>
            </div>
            <div class="stage" id="stage">
                <div class="stage-loading" id="stage-loading">
                    <div class="spinner" aria-hidden="true"></div>
                    <span class="stage-loading-text">Loading preview…</span>
                </div>
                <iframe id="dashboard-iframe" title="Melviz dashboard preview" allowfullscreen></iframe>
            </div>
        </section>
    </div>

    <!-- ============ GitHub overlay ============ -->
    <div class="overlay" id="github-overlay" hidden>
        <div class="overlay-panel" role="dialog" aria-label="Open from GitHub">
            <div class="overlay-head">
                <h2>Open from GitHub</h2>
                <button class="btn btn-ghost icon-btn" id="github-close" title="Close (Esc)">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round">
                        <path d="M18 6 6 18M6 6l12 12" />
                    </svg>
                </button>
            </div>

            <form id="github-form" class="github-form">
                <div class="github-token-row">
                    <label for="github-token">GitHub token <span class="opt">(optional, for private repos)</span></label>
                    <input id="github-token" type="password" placeholder="ghp_… / github_pat_…" autocomplete="off"
                        spellcheck="false">
                </div>
                <div class="github-row">
                    <div class="github-field">
                        <label for="github-owner">Owner / Organization</label>
                        <input id="github-owner" type="text" placeholder="melviz-org" required autocomplete="off"
                            spellcheck="false">
                    </div>
                    <div class="github-field grow">
                        <label for="github-repo">Repository</label>
                        <input id="github-repo" type="text" placeholder="melviz" required autocomplete="off"
                            spellcheck="false">
                    </div>
                </div>
                <div class="github-row">
                    <div class="github-field grow">
                        <label for="github-branch">Branch (blank = default)</label>
                        <input id="github-branch" type="text" placeholder="main" autocomplete="off" spellcheck="false">
                    </div>
                    <button class="btn btn-primary" id="github-load-repo" type="button">Load repository</button>
                </div>

                <div class="github-results" id="github-results" hidden>
                    <div class="github-results-head">
                        <span id="github-results-title"></span>
                        <button class="btn btn-ghost icon-btn" id="github-refresh-files" type="button"
                            title="Refresh the file list">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M21 12a9 9 0 1 1-2.64-6.36" />
                                <path d="M21 3v6h-6" />
                            </svg>
                        </button>
                    </div>
                    <input id="github-filter" type="text" placeholder="Filter YAML files…" autocomplete="off"
                        spellcheck="false">
                    <div class="github-file-list" id="github-files"></div>
                </div>

                <p class="github-hint" id="github-error" hidden></p>
            </form>
        </div>
    </div>

    <script src="codemirror.js"></script>
    <script src="app.js"></script>
</body>

</html>
